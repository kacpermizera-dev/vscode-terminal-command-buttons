name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # Kompilacja testów, build rozszerzenia i lint (pretest), potem testy w VS Code
      - name: Test
        run: xvfb-run -a npm test

      - name: Package
        run: npx --yes @vscode/vsce package

      - uses: actions/upload-artifact@v4
        with:
          name: vsix
          path: "*.vsix"
          if-no-files-found: error
